name: freecaller
description: "Family VoIP caller (Звонилка) — dead-simple, accessible, voice-first."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  firebase_core: ^4.4.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.4.0
  cloud_functions: ^6.1.0
  firebase_messaging: ^16.1.0
  livekit_client: ^2.8.0
  flutter_callkit_incoming: ^3.1.3
  uuid: ^4.5.0
  shared_preferences: ^2.3.0
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

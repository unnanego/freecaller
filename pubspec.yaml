name: freecaller
description: "Family VoIP caller (Звонилка) — dead-simple, accessible, voice-first."
publish_to: "none"
# THE VERSION is what identifies a release: bump the last component every time
# something is submitted — 1.1.0, 1.1.1, 1.1.2. That is the number to read in a
# commit message, a rejection email or a store listing.
#
# The +N behind it is not a second release number, it is Android's versionCode,
# and Google Play requires it to be strictly greater than anything ever uploaded
# to that track — a duplicate or a decrease is rejected forever. So it still has
# to move for a Play upload; it just isn't the thing that names the release.
#
# Apple takes it as CFBundleVersion, which only has to be unique WITHIN one
# version string, so a fresh version resets its meaning there.
#
# Beware `flutter build ipa` on its own: the ExportOptions.plist it generates
# sets manageAppVersionAndBuildNumber, and Xcode then silently rewrites
# CFBundleVersion at export to whatever App Store Connect will accept next —
# 1.1.0+13 went up to the store as build 14. Build with
# `--export-options-plist=ios/ExportOptions.plist` (see docs/RUNBOOK.md) so the
# binary carries the number written here.
version: 1.1.1+15

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # Firebase is kept for FCM only — the way an Android phone is woken for an
  # incoming call. Auth, the roster, call signaling and room tokens all moved to
  # the self-hosted PocketBase below. (iOS is woken by PushKit, not FCM.)
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.0
  pocketbase: ^0.24.0
  livekit_client: ^2.10.0
  flutter_callkit_incoming: ^3.1.3
  uuid: ^4.5.0
  shared_preferences: ^2.3.0
  permission_handler: ^11.3.0
  proximity_sensor: ^1.3.8
  flutter_contacts: ^2.2.2
  phone_numbers_parser: ^9.0.0
  share_plus: ^12.0.2
  google_fonts: ^6.2.1
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

dependency_overrides:
  # Vendored + patched flutter_callkit_incoming 3.1.3 (issue #827): the stock
  # plugin silences the Android incoming ringtone ~1s in because its volume-key
  # receiver misreads the self-managed Telecom audio-setup VOLUME_CHANGED
  # broadcast as a user key-press. The patch only stops the ring on a real RING-
  # stream volume change. See third_party/flutter_callkit_incoming.
  flutter_callkit_incoming:
    path: third_party/flutter_callkit_incoming

# App icon: white Lucide phone on the Modernist accent red. Regenerate with
# `dart run flutter_launcher_icons` after changing assets/icon/*.
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#EC3013"
  adaptive_icon_foreground: "assets/icon/foreground.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/sounds/

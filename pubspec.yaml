name: freecaller
description: "Family VoIP caller (Звонилка) — dead-simple, accessible, voice-first."
publish_to: "none"
version: 0.1.0+6

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  firebase_core: ^4.4.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.4.0
  cloud_functions: ^6.1.0
  firebase_messaging: ^16.1.0
  livekit_client: ^2.8.0
  flutter_callkit_incoming: ^3.1.3
  uuid: ^4.5.0
  shared_preferences: ^2.3.0
  permission_handler: ^11.3.0
  proximity_sensor: ^1.3.8
  flutter_contacts: ^2.2.2
  phone_numbers_parser: ^9.0.0
  share_plus: ^12.0.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

# App icon: white Lucide phone on the Modernist accent red. Regenerate with
# `dart run flutter_launcher_icons` after changing assets/icon/*.
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#EC3013"
  adaptive_icon_foreground: "assets/icon/foreground.png"

flutter:
  uses-material-design: true
  generate: true

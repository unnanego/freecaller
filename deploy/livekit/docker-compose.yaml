# Single-node self-hosted LiveKit for Freecaller, behind your existing nginx.
# nginx terminates TLS and reverse-proxies WSS signaling to livekit :7880;
# media flows directly to the server's public IP (see README.md).
# host networking so the media UDP/TCP ports are reachable directly.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: host
    command: redis-server --bind 127.0.0.1 --port 6379

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    network_mode: host
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    depends_on:
      - redis

# Single-node self-hosted LiveKit for Freecaller.
# host networking is used so the media (UDP) ports are reachable directly.
# See README.md for the full setup (domain, firewall, keys).
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: host
    command: redis-server --bind 127.0.0.1 --port 6379

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    network_mode: host
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    depends_on:
      - redis

  # Terminates TLS on :443 for both WSS signaling and TURN/TLS, using
  # automatic Let's Encrypt certs. livekit/caddyl4 is Caddy + the layer4
  # plugin, the image LiveKit ships for exactly this.
  caddy:
    image: livekit/caddyl4:latest
    restart: unless-stopped
    network_mode: host
    command: run --config /etc/caddy.yaml --adapter yaml
    volumes:
      - ./caddy.yaml:/etc/caddy.yaml
      - caddy_data:/data

volumes:
  caddy_data:
